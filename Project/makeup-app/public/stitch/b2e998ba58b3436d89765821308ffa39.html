<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- Header / Brand Anchor -->
<header class="w-full bg-surface border-b border-outline py-4 px-margin-mobile md:px-margin-desktop sticky top-0 z-10">
<div class="max-w-7xl mx-auto flex items-center justify-center">
<h1 class="font-display text-display text-primary">RiasKita</h1>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface border border-outline rounded-xl overflow-hidden flex flex-col shadow-sm">
<div class="p-6 md:p-8">
<h2 class="font-page-title text-page-title text-center mb-2">Buat Akun Baru</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8">Bergabung dengan komunitas makeup artist terbesar di Indonesia.</p>
<!-- Role Selection -->
<div class="grid grid-cols-2 gap-4 mb-8">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="customer">
<div class="p-4 border border-outline rounded-lg flex flex-col items-center justify-center gap-2 peer-checked:border-primary peer-checked:bg-surface-container-low transition-colors text-center h-full">
<span class="material-symbols-outlined text-3xl text-on-surface-variant peer-checked:text-primary">person</span>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-primary">Daftar sebagai Pelanggan</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="mua">
<div class="p-4 border border-outline rounded-lg flex flex-col items-center justify-center gap-2 peer-checked:border-primary peer-checked:bg-surface-container-low transition-colors text-center h-full">
<span class="material-symbols-outlined text-3xl text-on-surface-variant peer-checked:text-primary">brush</span>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-primary">Daftar sebagai MUA</span>
</div>
</label>
</div>
<!-- Registration Form -->
<form class="space-y-4">
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface" for="fullName">Nama Lengkap</label>
<input class="w-full rounded-lg border border-outline bg-surface px-4 py-2 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="fullName" placeholder="Masukkan nama lengkap" required="" type="text">
</div>
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="w-full rounded-lg border border-outline bg-surface px-4 py-2 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="email" placeholder="nama@email.com" required="" type="email">
</div>
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface" for="phone">Nomor Telepon</label>
<div class="flex">
<span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-outline bg-surface-variant text-on-surface-variant font-body-md text-body-md">
                                +62
                            </span>
<input class="w-full rounded-r-lg border border-outline bg-surface px-4 py-2 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="phone" placeholder="81234567890" required="" type="tel">
</div>
</div>
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<div class="relative">
<input class="w-full rounded-lg border border-outline bg-surface px-4 py-2 pr-10 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" placeholder="Minimal 8 karakter" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-start gap-2 pt-2 pb-4">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary bg-surface" id="terms" required="" type="checkbox">
</div>
<label class="font-caption text-caption text-on-surface-variant" for="terms">
                            Saya menyetujui <a class="text-primary hover:underline" href="#">Syarat &amp; Ketentuan</a> dan <a class="text-primary hover:underline" href="#">Kebijakan Privasi</a> yang berlaku.
                        </label>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-3 px-4 rounded-lg hover:opacity-90 transition-opacity flex justify-center items-center gap-2" type="submit">
                        Daftar Sekarang
                    </button>
</form>
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">Sudah punya akun? <a class="text-primary font-label-md text-label-md hover:underline" href="#">Masuk</a></p>
</div>
</div>
</div>
</main>
<!-- Suppressed Navigation Shells because this is a transactional/onboarding flow -->
