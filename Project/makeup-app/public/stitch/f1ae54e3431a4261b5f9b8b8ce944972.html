<body class="bg-background text-on-background antialiased min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="bg-surface border-b border-outline sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-unit max-w-7xl mx-auto h-16">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-page-title text-page-title text-primary">RiasKita</h1>
</div>
<div class="text-on-surface-variant font-label-md text-label-md">
            ID | EN
        </div>
</header>
<!-- Progress Indicator -->
<div class="bg-surface pt-4 pb-2 border-b border-outline px-margin-mobile md:px-margin-desktop sticky top-16 z-40">
<div class="max-w-3xl mx-auto">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-label-md text-primary">Langkah 1 dari 5</span>
<span class="font-label-md text-label-md text-on-surface-variant">Acara</span>
</div>
<div class="w-full bg-surface-container-highest rounded-full h-2 overflow-hidden">
<div class="bg-primary h-2 rounded-full w-1/5 transition-all duration-300 ease-in-out"></div>
</div>
</div>
</div>
<!-- Main Content - Step 1 -->
<main class="flex-grow w-full max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop py-8 pb-32">
<div class="mb-8">
<h2 class="font-section-heading text-section-heading text-on-surface mb-2">Detail Acara</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Beri tahu kami tentang acara Anda agar kami dapat mencocokkan Anda dengan MUA yang tepat.</p>
</div>
<form class="space-y-6">
<!-- Acara Type -->
<div class="space-y-3">
<label class="block font-label-md text-label-md text-on-surface">Jenis Acara</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="acara_type" type="radio" value="wedding">
<div class="rounded-lg border border-primary bg-primary-fixed-dim text-on-primary-container px-4 py-3 text-center font-label-md text-label-md transition-all peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container hover:bg-surface-container">
                            Pernikahan
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="acara_type" type="radio" value="engagement">
<div class="rounded-lg border border-outline bg-surface text-on-surface-variant px-4 py-3 text-center font-label-md text-label-md transition-all peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container hover:bg-surface-container">
                            Lamaran
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="acara_type" type="radio" value="graduation">
<div class="rounded-lg border border-outline bg-surface text-on-surface-variant px-4 py-3 text-center font-label-md text-label-md transition-all peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container hover:bg-surface-container">
                            Wisuda
                        </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="acara_type" type="radio" value="photoshoot">
<div class="rounded-lg border border-outline bg-surface text-on-surface-variant px-4 py-3 text-center font-label-md text-label-md transition-all peer-checked:bg-primary-container peer-checked:text-on-primary peer-checked:border-primary-container hover:bg-surface-container">
                            Photoshoot
                        </div>
</label>
</div>
</div>
<!-- Date & Time -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="date">Tanggal Acara</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-outline rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-primary focus:border-primary focus:outline-none transition-colors" id="date" type="date">
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="time">Target Waktu Selesai Makeup</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">schedule</span>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-outline rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-primary focus:border-primary focus:outline-none transition-colors" id="time" type="time">
</div>
</div>
</div>
<!-- Number of People -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface" for="people_count">Jumlah Orang yang Dirias</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">group</span>
</span>
<select class="block w-full pl-10 pr-10 py-2 border border-outline rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-primary focus:border-primary focus:outline-none transition-colors appearance-none" id="people_count">
<option value="1">1 Orang</option>
<option value="2">2 Orang</option>
<option value="3">3 Orang</option>
<option value="4+">4 Orang atau lebih</option>
</select>
<span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</span>
</div>
</div>
<!-- Inspiration Image Upload Placeholder (Decorative) -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface">Referensi Makeup (Opsional)</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center bg-surface-container-lowest hover:bg-surface-container-low transition-colors cursor-pointer">
<span class="material-symbols-outlined text-4xl text-outline-variant mb-2">add_photo_alternate</span>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Tarik &amp; lepas gambar ke sini<br>atau <span class="text-primary font-label-md text-label-md">Pilih dari perangkat</span></p>
</div>
</div>
</form>
</main>
<!-- Sticky Bottom CTA -->

<button class="flex-1 bg-primary-container text-on-primary rounded-lg py-3 font-label-md text-label-md hover:bg-opacity-90 transition-all shadow-sm">
                Lanjut ke Lokasi
            </button>
</div>
</div>
