<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface border border-outline rounded-xl p-8 shadow-sm flex flex-col items-center">
<!-- Icon / Graphic -->
<div class="w-16 h-16 bg-surface-container-low rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                lock_open
            </span>
</div>
<!-- Headers -->
<h1 class="font-page-title text-page-title text-center mb-2">Verify your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8">
            We've sent a 5-digit verification code to your registered email <br>
<strong class="text-on-surface">user@riaskita.com</strong>
</p>
<!-- OTP Input Area -->
<div class="w-full flex justify-between gap-2 mb-8">
<input autofocus="" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-display text-display bg-surface border border-outline rounded-lg text-primary focus:bg-surface-bright transition-colors" maxlength="1" type="number">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-display text-display bg-surface border border-outline rounded-lg text-primary focus:bg-surface-bright transition-colors" maxlength="1" type="number">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-display text-display bg-surface border border-outline rounded-lg text-primary focus:bg-surface-bright transition-colors" maxlength="1" type="number">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-display text-display bg-surface border border-outline rounded-lg text-primary focus:bg-surface-bright transition-colors" maxlength="1" type="number">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-display text-display bg-surface border border-outline rounded-lg text-primary focus:bg-surface-bright transition-colors" maxlength="1" type="number">
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary py-3 rounded-lg font-label-md text-label-md hover:opacity-90 transition-opacity flex items-center justify-center gap-2 mb-6 shadow-sm">
            Verify Code
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<!-- Resend Section -->
<div class="text-center font-body-md text-body-md text-on-surface-variant">
<p>Didn't receive the code?</p>
<div class="mt-2">
<span class="font-label-md text-label-md text-primary" id="timer">Resend in 00:59</span>
<button class="hidden font-label-md text-label-md text-primary hover:underline focus:outline-none" id="resendBtn">
                    Resend Code
                </button>
</div>
</div>
</main>
<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Prevent non-numeric input
            input.addEventListener('keypress', (e) => {
                if (e.key < '0' || e.key > '9') {
                    e.preventDefault();
                }
            });
        });

        // Timer Logic
        let timeLeft = 59;
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resendBtn');
        let timerId;

        function updateTimer() {
            if (timeLeft > 0) {
                timerElement.textContent = `Resend in 00:${timeLeft.toString().padStart(2, '0')}`;
                timeLeft--;
            } else {
                clearInterval(timerId);
                timerElement.classList.add('hidden');
                resendBtn.classList.remove('hidden');
            }
        }

        function startTimer() {
            timeLeft = 59;
            timerElement.classList.remove('hidden');
            resendBtn.classList.add('hidden');
            timerElement.textContent = `Resend in 00:59`;
            clearInterval(timerId);
            timerId = setInterval(updateTimer, 1000);
        }

        resendBtn.addEventListener('click', startTimer);
        
        // Start initial timer
        startTimer();
    </script>
