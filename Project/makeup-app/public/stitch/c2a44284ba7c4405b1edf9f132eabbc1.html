<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-md text-body-md">
<!-- Top App Bar - Simplified for Onboarding (No Nav Shell) -->
<header class="w-full top-0 sticky bg-surface border-b border-outline z-40">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-unit h-[64px] max-w-3xl mx-auto w-full">
<button class="text-on-surface-variant hover:bg-surface-variant transition-colors p-2 rounded-full flex items-center justify-center cursor-pointer active:opacity-80">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-page-title text-page-title text-primary md:text-page-title-desktop">MUA Marketplace</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop pt-8 pb-32">
<!-- Progress Indicator -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-label-md text-primary">Langkah 1 dari 3</span>
<span class="font-label-md text-label-md text-on-surface-variant">Identitas &amp; Bisnis</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-2">
<div class="bg-primary-container h-2 rounded-full" style="width: 33%"></div>
</div>
</div>
<div class="mb-8">
<h1 class="font-display text-display text-on-background mb-2">Mulai Perjalanan Anda</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Beritahu kami sedikit tentang diri Anda dan bisnis makeup Anda untuk mengatur profil Anda.</p>
</div>
<!-- Form Canvas - Level 1 Elevation -->
<div class="bg-surface border border-outline rounded-xl p-6 shadow-sm">
<form class="space-y-6">
<!-- Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="fullName">Nama Lengkap</label>
<input class="w-full rounded-lg border-outline bg-surface px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="fullName" name="fullName" placeholder="Masukkan nama lengkap Anda" type="text">
</div>
<!-- Business Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="businessName">Nama Bisnis (Opsional)</label>
<input class="w-full rounded-lg border-outline bg-surface px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="businessName" name="businessName" placeholder="Cth: Riana Makeup Artistry" type="text">
<p class="font-caption text-caption text-on-surface-variant mt-1">Biarkan kosong jika Anda menggunakan nama Anda sendiri sebagai nama bisnis.</p>
</div>
<!-- Experience Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="experience">Pengalaman (Tahun)</label>
<select class="w-full rounded-lg border-outline bg-surface px-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors appearance-none" id="experience" name="experience">
<option disabled="" selected="" value="">Pilih lama pengalaman</option>
<option value="0-1">Kurang dari 1 tahun</option>
<option value="1-3">1 - 3 tahun</option>
<option value="3-5">3 - 5 tahun</option>
<option value="5-10">5 - 10 tahun</option>
<option value="10+">Lebih dari 10 tahun</option>
</select>
</div>
<!-- Bio Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="bio">Tentang Anda (Bio)</label>
<textarea class="w-full rounded-lg border-outline bg-surface px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors resize-none" id="bio" name="bio" placeholder="Ceritakan singkat tentang gaya makeup Anda dan apa yang membuat layanan Anda spesial..." rows="4"></textarea>
<div class="flex justify-between items-center mt-1">
<span class="font-caption text-caption text-on-surface-variant">Tampil di profil publik Anda.</span>
<span class="font-caption text-caption text-on-surface-variant">0/500 karakter</span>
</div>
</div>
</form>
</div>
</main>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-0 w-full bg-surface border-t border-outline p-4 z-50">
<div class="max-w-3xl mx-auto">
<button class="w-full bg-primary-container text-on-primary rounded-xl py-4 font-label-md text-label-md flex justify-center items-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-sm">
                Lanjut ke Profil
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</div>
</div>
