<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface border border-outline rounded-xl p-6 md:p-8 shadow-sm">
<div class="text-center mb-8">
<h1 class="font-display text-display text-primary mb-2">RiasKita</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your account</p>
</div>
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="mail" style="font-variation-settings: 'FILL' 0;">mail</span>
</span>
<input class="w-full pl-10 pr-3 py-2 border border-outline rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-1 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-colors" id="email" placeholder="you@example.com" required="" type="email">
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="lock" style="font-variation-settings: 'FILL' 0;">lock</span>
</span>
<input class="w-full pl-10 pr-10 py-2 border border-outline rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-1 focus:ring-primary focus:border-primary placeholder-on-surface-variant/50 transition-colors" id="password" placeholder="••••••••" required="" type="password">
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<div class="flex items-center">
<input class="w-4 h-4 text-primary bg-surface border-outline rounded focus:ring-primary" id="remember" type="checkbox">
<label class="ml-2 font-body-md text-body-md text-on-surface-variant" for="remember">Remember me</label>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-primary-container transition-colors shadow-sm" type="submit">
                    Sign In
                </button>
</form>
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface font-caption text-caption text-on-surface-variant">Or continue with</span>
</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-3">
<button class="flex justify-center items-center py-2 px-4 border border-outline rounded-lg bg-surface text-on-surface font-label-md text-label-md hover:bg-surface-variant transition-colors">
<svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                        Google
                    </button>
<button class="flex justify-center items-center py-2 px-4 border border-outline rounded-lg bg-surface text-on-surface font-label-md text-label-md hover:bg-surface-variant transition-colors">
<svg class="h-5 w-5 mr-2" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05 1.9-3.16 1.9-1.09 0-1.48-.68-3.03-.68-1.55 0-1.99.68-3.03.68-1.12 0-2.29-.98-3.18-1.92-2.14-2.28-3.69-6.3-3.69-9.13 0-3.32 1.83-5.06 4.36-5.06 1.14 0 2.21.73 2.97.73.74 0 1.96-.81 3.28-.81 1.25 0 2.51.6 3.27 1.55-2.73 1.44-2.31 5.31.57 6.64-.67 1.88-1.74 3.73-3.36 5.14v.96zm-1.89-14.73c.69-.87 1.16-2.06 1.03-3.26-1.04.05-2.29.72-3 1.59-.62.77-1.16 2-1.01 3.19 1.16.09 2.3-.61 2.98-1.52z"></path></svg>
                        Apple
                    </button>
</div>
</div>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Register here</a>
</p>
</div>
</div>
</main>
</body></html>
