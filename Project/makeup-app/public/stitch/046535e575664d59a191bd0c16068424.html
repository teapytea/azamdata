<body class="bg-background text-on-background antialiased min-h-screen pb-24 md:pb-0">
<!-- Top App Bar (Modified for linear onboarding flow - simplified) -->
<header class="bg-surface sticky top-0 z-50 border-b border-outline w-full flex justify-between items-center px-margin-mobile py-unit">
<div class="flex items-center gap-4">
<button class="text-primary hover:bg-surface-variant p-2 rounded-full transition-colors cursor-pointer active:opacity-80">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-section-heading-mobile text-section-heading-mobile md:font-section-heading md:text-section-heading text-primary">Langkah 4 dari 5</h1>
</div>
<div class="hidden md:block">
<span class="font-label-md text-label-md text-on-surface-variant">Simpan &amp; Keluar</span>
</div>
</header>
<main class="max-w-3xl mx-auto px-margin-mobile md:px-margin-desktop py-8 md:py-12 flex flex-col gap-8">
<!-- Header Section -->
<section class="flex flex-col gap-2">
<h2 class="font-page-title text-page-title text-on-surface">Jadwal &amp; Lokasi</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Atur jam kerja, area layanan operasional, dan ketentuan biaya perjalanan Anda.</p>
</section>
<!-- Working Hours Section -->
<section class="bg-surface rounded-xl border border-outline p-6 flex flex-col gap-6">
<div class="flex items-center gap-3 border-b border-outline pb-4">
<span class="material-symbols-outlined text-primary">schedule</span>
<h3 class="font-card-title text-card-title text-on-surface">Jam Kerja Reguler</h3>
</div>
<div class="flex flex-col gap-4">
<!-- Day Toggle -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 cursor-pointer">
<input checked="" class="form-checkbox h-5 w-5 text-primary rounded border-outline focus:ring-primary" type="checkbox">
<span class="font-body-md text-body-md text-on-surface">Senin - Jumat</span>
</label>
<div class="flex items-center gap-2">
<input class="form-input w-28 rounded-lg border-outline font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary" type="time" value="08:00">
<span class="font-body-md text-body-md text-on-surface-variant">-</span>
<input class="form-input w-28 rounded-lg border-outline font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary" type="time" value="17:00">
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 cursor-pointer">
<input checked="" class="form-checkbox h-5 w-5 text-primary rounded border-outline focus:ring-primary" type="checkbox">
<span class="font-body-md text-body-md text-on-surface">Sabtu</span>
</label>
<div class="flex items-center gap-2">
<input class="form-input w-28 rounded-lg border-outline font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary" type="time" value="06:00">
<span class="font-body-md text-body-md text-on-surface-variant">-</span>
<input class="form-input w-28 rounded-lg border-outline font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary" type="time" value="15:00">
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 cursor-pointer">
<input class="form-checkbox h-5 w-5 text-primary rounded border-outline focus:ring-primary" type="checkbox">
<span class="font-body-md text-body-md text-on-surface">Minggu</span>
</label>
<div class="flex items-center gap-2 opacity-50 pointer-events-none">
<input class="form-input w-28 rounded-lg border-outline font-body-md text-body-md text-on-surface bg-surface-variant" disabled="" type="time" value="00:00">
<span class="font-body-md text-body-md text-on-surface-variant">-</span>
<input class="form-input w-28 rounded-lg border-outline font-body-md text-body-md text-on-surface bg-surface-variant" disabled="" type="time" value="00:00">
</div>
</div>
</div>
</section>
<!-- Service Area & Map Section -->
<section class="bg-surface rounded-xl border border-outline p-6 flex flex-col gap-6">
<div class="flex items-center gap-3 border-b border-outline pb-4">
<span class="material-symbols-outlined text-primary">location_on</span>
<h3 class="font-card-title text-card-title text-on-surface">Area Layanan &amp; Radius</h3>
</div>
<div class="flex flex-col gap-4">
<label class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface">Kota Basis Operasional</span>
<select class="form-select w-full rounded-lg border-outline font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary">
<option>Surabaya</option>
<option>Sidoarjo</option>
<option>Gresik</option>
<option>Malang</option>
</select>
</label>
<label class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface">Radius Layanan Maksimal (km)</span>
<input class="form-input w-full rounded-lg border-outline font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary" type="number" value="25">
</label>
<!-- Map Preview -->
<div class="relative w-full h-64 rounded-xl overflow-hidden border border-outline bg-surface-variant mt-2">
<img class="object-cover w-full h-full opacity-80 mix-blend-multiply" data-alt="A modern, high-contrast map interface centered on Surabaya, Indonesia, designed in a sleek corporate UI style. A subtle, semi-transparent deep plum (#682c4b) circular overlay illustrates a 25km service radius. The map features minimal labels and clean geometric roads in a light mode palette." data-location="Surabaya" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7W6wSYBsMVheqGI5mwWwRcjZHXNKosY7HVoVOUdQ8yoPWHYOkI_3qUgWm17LuxzeJcHuFhb6RaYg8lHHoW_8fQs6bnK4OaDq1OZT7Ehj_Nwt600MVg5V8kxydcW6hi10g6v9dIHwW0jx0ASVeWr3skf5QNLEgNNG9mAVTdDaubzGwYmOK_qhe_DYuHZn6d4Gu0aSIdsbG2pAXFdqcD7GOZblC8TB3LoCqRBIxmKw-8cCcsOuty9qktA">
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-4 h-4 bg-primary rounded-full shadow-md z-10 relative">
<div class="absolute inset-0 bg-primary rounded-full animate-ping opacity-50"></div>
</div>
</div>
</div>
</div>
</section>
<!-- Travel Fee Rules -->
<section class="bg-surface rounded-xl border border-outline p-6 flex flex-col gap-6">
<div class="flex items-center gap-3 border-b border-outline pb-4">
<span class="material-symbols-outlined text-primary">local_taxi</span>
<h3 class="font-card-title text-card-title text-on-surface">Biaya Perjalanan (Transport)</h3>
</div>
<div class="flex flex-col gap-4">
<label class="flex items-center gap-3 cursor-pointer p-3 border border-outline rounded-lg hover:bg-surface-variant transition-colors">
<input checked="" class="form-radio h-5 w-5 text-primary border-outline focus:ring-primary" name="travel_fee" type="radio">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Gratis dalam Radius</span>
<span class="font-caption text-caption text-on-surface-variant">Biaya tambahan dikenakan jika melebihi radius tertentu</span>
</div>
</label>
<div class="pl-10 flex flex-col sm:flex-row gap-4 items-center">
<div class="flex items-center gap-2 w-full sm:w-auto">
<span class="font-body-md text-body-md text-on-surface-variant">Gratis hingga</span>
<input class="form-input w-20 rounded-lg border-outline font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary" type="number" value="10">
<span class="font-body-md text-body-md text-on-surface-variant">km</span>
</div>
<div class="flex items-center gap-2 w-full sm:w-auto">
<span class="font-body-md text-body-md text-on-surface-variant">lalu</span>
<div class="relative w-full sm:w-32">
<span class="absolute left-3 top-1/2 -translate-y-1/2 font-body-md text-on-surface-variant">Rp</span>
<input class="form-input w-full pl-9 rounded-lg border-outline font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary" type="number" value="5000">
</div>
<span class="font-body-md text-body-md text-on-surface-variant">/km</span>
</div>
</div>
<label class="flex items-center gap-3 cursor-pointer p-3 border border-outline rounded-lg hover:bg-surface-variant transition-colors mt-2">
<input class="form-radio h-5 w-5 text-primary border-outline focus:ring-primary" name="travel_fee" type="radio">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Tetap (Flat Rate)</span>
<span class="font-caption text-caption text-on-surface-variant">Satu harga untuk semua lokasi dalam radius maksimal</span>
</div>
</label>
</div>
</section>
</main>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-0 w-full bg-surface border-t border-outline p-margin-mobile flex justify-end items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] md:relative md:bg-transparent md:border-none md:shadow-none md:max-w-3xl md:mx-auto md:px-margin-desktop md:pb-12 md:pt-0">
<button class="w-full md:w-auto bg-primary text-on-primary font-label-md text-label-md py-3 px-6 rounded-lg hover:bg-primary/90 active:scale-95 transition-all duration-150 flex justify-center items-center gap-2 shadow-sm">
            Lanjut ke Verifikasi
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
