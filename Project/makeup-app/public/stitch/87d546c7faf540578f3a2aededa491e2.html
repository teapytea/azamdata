<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- Transactional Header (Simplified) -->
<header class="w-full flex items-center justify-between px-margin-mobile md:px-margin-desktop py-4 md:py-6 sticky top-0 z-50 bg-surface/90 backdrop-blur-md border-b border-outline">
<a class="flex items-center text-on-surface-variant hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined mr-2 group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md hidden md:inline-block">Kembali ke Login</span>
</a>
<div class="font-display text-card-title text-primary">RiasKita</div>
<div class="w-8 md:w-[120px]"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md">
<!-- Contextual Illustration/Graphic -->
<div class="mb-8 flex justify-center">
<div class="w-24 h-24 bg-surface-container-high rounded-full flex items-center justify-center shadow-sm border border-outline-variant">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="lock_reset" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
</div>
<!-- Header Text -->
<div class="text-center mb-8">
<h1 class="font-page-title text-page-title text-on-surface mb-2">Forgot Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">
                    Masukkan email yang terdaftar. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi Anda.
                </p>
</div>
<!-- Form Card -->
<div class="bg-surface rounded-xl border border-outline shadow-sm p-6 md:p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-surface-variant text-on-surface focus:ring-2 focus:ring-primary focus:border-primary focus:bg-surface transition-colors font-body-md text-body-md placeholder-on-surface-variant/50" id="email" name="email" placeholder="nama@email.com" required="" type="email">
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg text-on-primary bg-primary-container hover:bg-primary hover:shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all font-label-md text-label-md group" type="submit">
<span>Kirim Tautan Reset</span>
<span class="material-symbols-outlined ml-2 text-lg group-hover:translate-x-1 transition-transform" data-icon="send">send</span>
</button>
</form>
</div>
<!-- Help/Support Link -->
<div class="mt-8 text-center">
<p class="font-caption text-caption text-on-surface-variant">
                    Butuh bantuan? <a class="font-label-md text-primary hover:underline underline-offset-2" href="#">Hubungi Dukungan</a>
</p>
