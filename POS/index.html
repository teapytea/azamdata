<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
      }
      .sidebar {
        width: 250px;
        height: 100vh;
        background-color: #333;
        color: white;
        position: fixed;
        top: 0;
        left: 0;
      }
      .sidebar h2 {
        text-align: center;
        margin: 0;
        padding: 20px;
        background-color: #444;
      }
      .sidebar ul {
        list-style: none;
        padding: 0;
      }
      .sidebar ul li {
        padding: 15px;
        cursor: pointer;
      }
      .sidebar ul li:hover {
        background-color: #555;
      }
      .content {
        margin-left: 250px;
        padding: 20px;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .card {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .card h3 {
        margin-bottom: 10px;
      }
      .card p {
        font-size: 14px;
        color: gray;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>Admin Panel</h2>
      <ul>
        <li onclick="navigateTo('clients')">Clients</li>
        <li onclick="navigateTo('services')">Services</li>
        <li onclick="navigateTo('schedules')">Schedules</li>
        <li onclick="navigateTo('invoices')">Invoices</li>
      </ul>
    </div>
    <div class="content">
      <h1>Welcome to Admin Dashboard</h1>
      <div class="dashboard-grid">
        <div class="card">
          <h3>Total Clients</h3>
          <p>Manage all clients in the system</p>
        </div>
        <div class="card">
          <h3>Total Services</h3>
          <p>Track and define services</p>
        </div>
        <div class="card">
          <h3>Active Schedules</h3>
          <p>Monitor schedules in progress</p>
        </div>
        <div class="card">
          <h3>Pending Invoices</h3>
          <p>Check and follow up on unpaid invoices</p>
        </div>
      </div>
    </div>
    <script>
      function navigateTo(section) {
        alert(`Navigating to ${section}`);
      }
    </script>
  </body>
</html>
